<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e0e5ec">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Tiffin Tracker</title>
<style>
:root{--bg:#e0e5ec;--tx:#3d4852;--sub:#7b8794;--s1:#a3b1c6;--s2:#fff;--ok:#2e9e6b;--no:#d9534f;--ac:#5b7bd5}
body.dark{--bg:#2a2d34;--tx:#e4e7ec;--sub:#9aa3b0;--s1:#1b1d22;--s2:#393d47}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;min-height:100dvh}
#app{max-width:480px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 16px 110px}
header{display:flex;justify-content:space-between;align-items:center}
h1,h2,h3{margin:0}h1{font-size:30px}h2{font-size:19px}h3{font-size:22px}
small,.sub{color:var(--sub);font-size:13px}
button{font:inherit;color:var(--tx);background:var(--bg);border:0;border-radius:14px;padding:11px 14px;cursor:pointer;box-shadow:5px 5px 10px var(--s1),-5px -5px 10px var(--s2)}
button:active,button.act{box-shadow:inset 3px 3px 6px var(--s1),inset -3px -3px 6px var(--s2)}
.card{background:var(--bg);border-radius:20px;padding:16px;margin:0 0 16px}
.raise{box-shadow:6px 6px 12px var(--s1),-6px -6px 12px var(--s2)}
.press{box-shadow:inset 5px 5px 10px var(--s1),inset -5px -5px 10px var(--s2)}
.center{text-align:center}.wide{width:100%;margin-top:10px}
.row{display:flex;gap:10px;margin:14px 0}.row>*{flex:1}.between{align-items:center;justify-content:space-between}.between>h2{flex:2;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meals{display:grid;gap:14px;margin:16px 0}
.meal{display:flex;align-items:center;gap:12px;padding:18px;border-radius:20px;text-align:left;width:100%}
.meal .em{font-size:26px}.meal b{flex:1}.meal small{color:inherit;opacity:.85}
.meal.on{box-shadow:inset 5px 5px 10px var(--s1),inset -5px -5px 10px var(--s2);color:var(--ok)}
.meal.off{box-shadow:inset 5px 5px 10px var(--s1),inset -5px -5px 10px var(--s2);color:var(--no)}
.note{padding:10px 14px;border-radius:14px;margin-top:10px;color:var(--ac);box-shadow:inset 3px 3px 6px var(--s1),inset -3px -3px 6px var(--s2)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:14px 0}.wd{font-style:normal;text-align:center;color:var(--sub);font-size:13px}
.day{padding:8px 0;border-radius:12px;font-size:14px;box-shadow:3px 3px 6px var(--s1),-3px -3px 6px var(--s2)}
.day span{display:flex;gap:2px;justify-content:center;margin-top:4px}
u{width:6px;height:6px;border-radius:50%;background:var(--s1);opacity:.5}u.on{background:var(--ok);opacity:1}u.off{background:var(--no);opacity:1}
.day.tk{color:var(--ac);font-weight:700}
.okc{color:var(--ok)}.noc{color:var(--no)}.danger{color:var(--no)}
input{width:100%;padding:12px 14px;border:0;border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin:6px 0 10px;outline:0;box-shadow:inset 3px 3px 6px var(--s1),inset -3px -3px 6px var(--s2)}
input[type=checkbox]{width:22px;height:22px;margin:0}
label{display:block;font-size:13px;color:var(--sub)}label.sw{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--tx)}
.sec{margin:16px 0}.sec>b{display:block;margin-bottom:6px}
.pay{display:flex;align-items:center;gap:10px;padding:10px 0}.pay span{flex:1}.pay small{display:block}.pay button{padding:6px 10px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
nav button{flex:1;padding:13px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:5}.ov.show{display:flex}
#mbody{background:var(--bg);width:100%;max-width:480px;max-height:88dvh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
#dlg{align-items:center;z-index:9}.box{width:86%;max-width:340px;margin:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;display:none;z-index:10;font-size:14px}
.xrow,.lpt{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#lp{z-index:7;align-items:center;background:rgba(0,0,0,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lpbox{width:88%;max-width:400px;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));padding:9px 18px;z-index:4;font-size:14px}
.trk{height:12px;border-radius:8px;overflow:hidden;box-shadow:inset 3px 3px 6px var(--s1),inset -3px -3px 6px var(--s2)}
.trk i{display:block;height:100%;background:var(--ac);border-radius:8px}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:190px;z-index:3;padding:12px}.menu button{width:100%;margin-bottom:8px}.menu button:last-child{margin:0}
.vt{height:140px;margin:6px 0;display:flex;align-items:flex-end;border-radius:8px;padding:3px;box-shadow:inset 3px 3px 6px var(--s1),inset -3px -3px 6px var(--s2)}.vt i{display:block;width:100%;background:var(--ac);border-radius:6px}
.mbk{position:fixed;inset:0;background:rgba(0,0,0,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:2}
.anim{animation:fup .35s ease-out}.anim .trk i{animation:gw .6s ease-out}.anim .vt i{animation:gh .6s ease-out}
@keyframes fup{from{opacity:0;transform:translateY(14px)}}@keyframes gw{from{width:0}}@keyframes gh{from{height:0}}
</style></head><body>
<div id="app"><header><h1>Tiffin Tracker</h1><button data-a="set" aria-label="Settings">⚙️</button></header><main id="main"></main></div>
<nav><button data-t="today">Today</button><button data-t="cal">Calendar</button><button data-t="pay">Payments</button></nav>
<div class="ov" id="modal"><div id="mbody"></div></div><div class="ov" id="dlg"></div><div class="ov" id="lp"></div><div id="toast"></div>
<input type="file" id="fc" accept=".txt,text/plain" hidden><input type="file" id="fb" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s),K='tiffin_v1',MS=['b','l','d'],NM={b:'Breakfast',l:'Lunch',d:'Dinner'},EM={b:'🌅',l:'🍱',d:'🌙'};
const p2=n=>String(n).padStart(2,'0'),dk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),pk=k=>{const a=k.split('-');return new Date(+a[0],a[1]-1,+a[2])};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rs=n=>'₹'+n;
const def=()=>({prices:{b:40,l:40,d:40},name:'Manish',days:{},pays:[],exp:[],expTab:false,fx:true,dark:matchMedia('(prefers-color-scheme:dark)').matches});
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.days){const d=def();return{...d,...s,prices:{...d.prices,...s.prices}}}}catch(e){}return def()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save data')}}
let S=load(),anim=false,wkS='',moY=0,ovF='',ovT='',crF='',crT='',ana=false,anaV='ov',anaMenu=false,lp=null,lt=null,sx=0,sy=0,pF='',pT='',payOpen=false,pr=false,tab='today',md=null,pend=null,cal={y:new Date().getFullYear(),m:new Date().getMonth()};
const ent=(k,m)=>(S.days[k]||{})[m];
function setM(k,m,s){const d=S.days[k]=S.days[k]||{};if(s==null)delete d[m];else d[m]={s,p:d[m]?d[m].p:S.prices[m]};if(!Object.keys(d).length)delete S.days[k]}
function cyc(k,m){const e=ent(k,m),n=!e?1:e.s===1?0:null;setM(k,m,n);fx(n===1?880:n===0?440:330);save();render()}
function all(k,s){MS.forEach(m=>setM(k,m,s));save();render()}
function sum(pre){let t=0,c=0;for(const k in S.days)if(k.startsWith(pre))for(const m in S.days[k]){const e=S.days[k][m];if(e.s){t+=e.p;c++}}return{t,c}}
function cards(k){return MS.map(m=>{const e=ent(k,m);return `<button class="meal ${!e?'':e.s?'on':'off'}" data-a="cyc" data-k="${k}" data-m="${m}"><span class="em">${EM[m]}</span><b>${NM[m]}</b><small>${!e?'':e.s?'Taken · '+rs(e.p):'Skipped'}</small></button>`}).join('')}
function vToday(){const n=new Date(),k=dk(n);
return `<h2 style="margin-top:18px">${n.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</h2><div class="meals">${cards(k)}</div><div class="row"><button data-a="all" data-k="${k}" data-s="1">All taken</button><button data-a="all" data-k="${k}" data-s="0">Skip day</button><button data-a="clr" data-k="${k}">Clear</button></div>`}
function vCal(){const{y,m}=cal,f=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),pre=y+'-'+p2(m+1),tk=dk(new Date());
let g=['S','M','T','W','T','F','S'].map(x=>`<i class="wd">${x}</i>`).join('')+'<i></i>'.repeat(f);
for(let d=1;d<=dim;d++){const k=pre+'-'+p2(d);g+=`<button class="day ${k===tk?'tk':''}" style="background:linear-gradient(rgba(46,158,107,${[0,.14,.28,.45][MS.filter(x=>{const e=ent(k,x);return e&&e.s}).length]}),rgba(46,158,107,${[0,.14,.28,.45][MS.filter(x=>{const e=ent(k,x);return e&&e.s}).length]})),var(--bg)" data-a="day" data-k="${k}">${d}<span>${MS.map(x=>{const e=ent(k,x);return `<u class="${!e?'':e.s?'on':'off'}"></u>`}).join('')}</span></button>`}
return `<div class="row between" style="margin-top:18px"><button data-a="mo" data-d="-1">‹</button><h2>${new Date(y,m,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h2><button data-a="mo" data-d="1">›</button></div><div class="cg">${g}</div>`}
const inR=k=>!((pF&&k<pF)||(pT&&k>pT)),fd=k=>k.split('-').reverse().join('/'),ft=t=>{const a=t.split(':');return(a[0]%12||12)+':'+a[1]+(a[0]<12?' AM':' PM')};
function vPay(){const ps=S.pays.filter(p=>inR(p.d));let tot=0;for(const k in S.days)if(inR(k))for(const m in S.days[k]){const e=S.days[k][m];if(e.s)tot+=e.p}const pn=tot-ps.reduce((a,p)=>a+p.a,0);
return `<div class="grid2" style="margin:18px 0 14px"><label>From<input type="date" id="pf" value="${pF}"></label><label>To<input type="date" id="pt" value="${pT}"></label></div><div class="card press center"><small>Pending</small><h1 class="${pn>0?'noc':'okc'}">${rs(pn)}</h1></div>${payOpen?'<div class="card raise"><input id="pa" type="number" inputmode="decimal" placeholder="Amount paid (₹)"><input id="pn" placeholder="Note"><div class="row" style="margin-bottom:0"><button data-a="addp">Cancel</button><button data-a="savep">Save</button></div></div>':'<button class="wide" style="margin:0 0 18px" data-a="addp">Add payment</button>'}<h3>History</h3>${ps.length?[...ps].sort((a,b)=>b.d.localeCompare(a.d)||b.i-a.i).map(p=>`<div class="pay"><span>${p.d}<small>${esc(p.n||'')}</small></span><b>${rs(p.a)}</b><button data-a="delp" data-i="${p.i}">✕</button></div>`).join(''):''}`}
function vExp(){return `<div class="card raise" style="margin-top:18px"><h2>Add</h2><input id="ea" type="number" inputmode="decimal" placeholder="Amount (₹)" style="margin-top:12px"><input id="en" placeholder="Note (optional)"><button class="wide" style="margin:0" data-a="adde">Save</button></div><h3>History</h3>${[...S.exp].sort((a,b)=>(b.d+b.t).localeCompare(a.d+a.t)||b.i-a.i).map(x=>`<div class="pay xrow" data-i="${x.i}"><span>${fd(x.d)} · ${ft(x.t)}<small>${esc(x.n||'')}</small></span><b>${rs(x.a)}</b></div>`).join('')}<button class="fab" data-a="ana">Analyze</button>`}
const AN={wk:'Week wise',mo:'Month wise',ov:'Overview',cr:'Custom report'};
const na=v=>v?rs(Math.round(v*100)/100):'N/A',mon=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x},inD=(k,f,t)=>!((f&&k<f)||(t&&k>t));
const bars=r=>{const mx=Math.max(1,...r.map(v=>v[1]));return r.map(v=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>${v[0]}</span><b>${na(v[1])}</b></div><div class="trk"><i style="width:${Math.round(v[1]/mx*100)}%"></i></div></div>`).join('')};
const stats=L=>{const n=L.length,T=L.reduce((a,x)=>a+x.a,0),dy=new Set(L.map(x=>x.d)).size,am=L.map(x=>x.a);return[['Total',na(T)],['Entries',n||'N/A'],['Average / entry',n?na(T/n):'N/A'],['Average / day',dy?na(T/dy):'N/A'],['Highest',n?na(Math.max(...am)):'N/A'],['Lowest',n?na(Math.min(...am)):'N/A']]};
const cardsH=(st,lpt)=>`<div class="grid2">${st.map((c,i)=>`<div class="card raise ${i===0&&lpt?'lpt':''}"><small>${c[0]}</small><h3>${c[1]}</h3></div>`).join('')}</div>`;
const nav=(a,t)=>`<div class="row between"><button data-a="${a}" data-d="-1">‹</button><b style="flex:2;text-align:center">${t}</b><button data-a="${a}" data-d="1">›</button></div>`;
function vAna(){if(!wkS)wkS=dk(mon(new Date()));if(!moY)moY=new Date().getFullYear();const E=S.exp;let b='';
if(anaV==='wk'){const st=pk(wkS),mid=new Date(st);mid.setDate(mid.getDate()+3);const ds=[0,1,2,3,4,5,6].map(i=>{const d=new Date(st);d.setDate(d.getDate()+i);return dk(d)}),vs=ds.map(k=>E.filter(x=>x.d===k).reduce((a,x)=>a+x.a,0)),mx=Math.max(1,...vs);
b=nav('wm',mid.toLocaleDateString('en-IN',{month:'long',year:'numeric'}))+nav('ww',fd(ds[0]).slice(0,5)+' – '+fd(ds[6]).slice(0,5))+`<div class="card press"><div style="display:flex;gap:6px">${ds.map((k,i)=>`<div style="flex:1;text-align:center"><small style="font-size:11px">${na(vs[i])}</small><div class="vt"><i style="height:${Math.round(vs[i]/mx*100)}%"></i></div><small>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</small></div>`).join('')}</div></div>`}
else if(anaV==='mo'){b=nav('my',moY)+`<div class="card press" style="padding:4px 16px">${bars(Array.from({length:12},(_,i)=>[new Date(moY,i,1).toLocaleDateString('en-IN',{month:'long'}),E.filter(x=>x.d.startsWith(moY+'-'+p2(i+1))).reduce((a,x)=>a+x.a,0)]))}</div>`}
else if(anaV==='ov'){const st=stats(E.filter(x=>inD(x.d,ovF,ovT)));if(ovF||ovT)st[0][0]='Total · '+(ovF?fd(ovF):'…')+' – '+(ovT?fd(ovT):'…');b=cardsH(st,true)}
else{const L=E.filter(x=>inD(x.d,crF,crT));b=`<div class="grid2" style="margin:14px 0"><label>From<input type="date" id="cf" value="${crF}"></label><label>To<input type="date" id="ct" value="${crT}"></label></div>${cardsH(stats(L),false)}<h3>Transactions</h3>${L.length?[...L].sort((a,c)=>(c.d+c.t).localeCompare(a.d+a.t)).map(x=>`<div class="pay"><span>${fd(x.d)} · ${ft(x.t)}<small>${esc(x.n||'')}</small></span><b>${rs(x.a)}</b></div>`).join(''):'<div class="pay"><span>N/A</span></div>'}`}
return `${anaMenu?'<div class="mbk" data-a="amenu"></div>':''}<div class="row between" style="margin-top:18px"><button data-a="aback">‹</button><h2>${AN[anaV]}</h2><div style="position:relative"><button style="width:100%" data-a="amenu">⋮</button>${anaMenu?`<div class="card raise menu">${Object.keys(AN).map(k=>`<button class="${anaV===k?'act':''}" data-a="av" data-v="${k}">${AN[k]}</button>`).join('')}</div>`:''}</div></div><div class="${anim?'anim':''}" style="margin-top:6px">${b}</div>`}
function lpHtml(x){return `<div class="lpbox"><div class="card raise pay" style="margin:0 0 14px;padding:16px"><span>${fd(x.d)} · ${ft(x.t)}<small>${esc(x.n||'')}</small></span><b>${rs(x.a)}</b></div>${lp.edit?`<div class="card raise"><div class="grid2"><label>Date<input type="date" id="xd" value="${x.d}"></label><label>Time<input type="time" id="xt2" value="${x.t}"></label></div><div class="row" style="margin-bottom:0"><button data-a="xcan">Cancel</button><button data-a="xsave">Save</button></div></div>`:`<div class="row" style="margin:0"><button data-a="xed">Edit</button><button class="danger" data-a="xdel">✕</button></div>`}</div>`}
function showLp(){if(lp.ov){$('#lp').innerHTML=`<div class="lpbox"><div class="card raise"><h3>Date range</h3><div class="grid2" style="margin:14px 0"><label>From<input type="date" id="of" value="${ovF}"></label><label>To<input type="date" id="ot" value="${ovT}"></label></div><div class="row" style="margin-bottom:0"><button data-a="ovr">Reset</button><button data-a="ovs">Apply</button></div></div></div>`;$('#lp').classList.add('show');return}const x=S.exp.find(v=>v.i===lp.i);if(!x){closeLp();return}$('#lp').innerHTML=lpHtml(x);$('#lp').classList.add('show')}
function closeLp(){lp=null;$('#lp').classList.remove('show')}
function exHtml(){const k=Object.keys(S.days).sort();return `<h3>Export</h3><div class="grid2" style="margin:14px 0"><label>From<input type="date" id="ef" value="${k[0]}"></label><label>To<input type="date" id="et" value="${k[k.length-1]}"></label></div><div class="row"><button data-a="close">Cancel</button><button data-a="dcsv">Export</button></div>`}
function setHtml(){return `<h3>Settings</h3><div class="sec"><button class="wide ${pr?'act':''}" style="margin:0" data-a="tp">Meal prices</button>${pr?`<div class="grid3" style="margin-top:14px">${MS.map(m=>`<label>${NM[m]}<input type="number" inputmode="decimal" data-p="${m}" value="${S.prices[m]}"></label>`).join('')}</div>`:''}</div>
<div class="sec"><label>Your name in the chat<input id="sn" value="${esc(S.name)}"></label></div>
<div class="sec"><label class="sw"><span>Expense tab instead of Today</span><input type="checkbox" id="xt" ${S.expTab?'checked':''}></label></div>
<div class="sec"><label class="sw"><span>Sound &amp; vibration</span><input type="checkbox" id="fx" ${S.fx?'checked':''}></label></div>
<div class="sec"><label class="sw"><span>Dark theme</span><input type="checkbox" id="dm" ${S.dark?'checked':''}></label></div>
<div class="sec"><button class="wide" style="margin:0" data-a="imc">Import WhatsApp chat</button></div>
<div class="sec"><button class="wide" style="margin:0" data-a="csv">Export</button><button class="wide" data-a="cse">Export expense</button><div class="row"><button data-a="exp">Backup</button><button data-a="imb">Restore</button></div></div>
<button class="wide danger" data-a="reset">Reset all data</button><button class="wide" data-a="close">Close</button>`}
function prevHtml(){const p=pend;return `<h3>Import preview</h3><div class="card press" style="margin-top:14px"><p><b>${p.n}</b> days found: ${p.n-p.gap} in the chat, ${p.gap} with no post (marked skipped)</p><p>Taken: ${p.c.b} breakfast, ${p.c.l} lunch, ${p.c.d} dinner = <b>${rs(p.amt)}</b></p>${p.conf.length?`<label class="sw"><span>Overwrite ${p.conf.length} day(s) you already set</span><input type="checkbox" id="ow"></label>`:''}</div><div class="row"><button data-a="close">Cancel</button><button data-a="applyc">Import</button></div>`}
function mHtml(){return md.t==='day'?`<h3>${pk(md.k).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</h3><div class="meals">${cards(md.k)}</div><button class="wide" data-a="close">Done</button>`:md.t==='set'?setHtml():md.t==='ex'?exHtml():prevHtml()}
function showM(){$('#mbody').innerHTML=mHtml();$('#modal').classList.add('show')}
function closeM(){md=null;$('#modal').classList.remove('show')}
function render(){document.body.classList.toggle('dark',S.dark);$('#main').innerHTML=({today:S.expTab?(ana?vAna:vExp):vToday,cal:vCal,pay:vPay})[tab]();anim=false;document.querySelector('nav button').textContent=S.expTab?'Expense':'Today';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('act',b.dataset.t===tab));if(md&&md.t==='day')$('#mbody').innerHTML=mHtml()}
let undoFn=null,ac=null;
function toast(t,u){const e=$('#toast');undoFn=u||null;e.innerHTML=esc(t)+(u?'<b data-a="undo" style="margin-left:16px;text-decoration:underline">Undo</b>':'');e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',u?6000:2800)}
function withUndo(msg,fn){const snap=JSON.stringify(S);fn();toast(msg,()=>{S=JSON.parse(snap);save();render()})}
function fx(f){if(!S.fx)return;try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.08);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.09)}catch(e){}}
function ask(msg,ok){return new Promise(r=>{const d=$('#dlg');d.innerHTML=`<div class="box card raise"><p>${msg}</p><div class="row"><button id="dn">Cancel</button><button id="dy" class="danger">${ok}</button></div></div>`;d.classList.add('show');$('#dn').onclick=()=>{d.classList.remove('show');r(false)};$('#dy').onclick=()=>{d.classList.remove('show');r(true)}})}
const MN=['january','february','march','april','may','june','july','august','september','october','november','december'];
function parseChat(t){const out={},rx=new RegExp('(^|[^a-z])'+S.name.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z]|$)','i'),hd=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4}),\s[^-]*-\s(?:[^:]+:\s?)?/;let yr=0,day=null,meal=null;
const go=l=>{l=l.trim();if(!l){meal=null;return}const s=l.replace(/\*/g,'').trim(),dm=s.match(/^(\d{1,2})\s+([A-Za-z]+)\b/),mm=s.match(/^(breakfast|lunch|dinner)/i);
if(dm){const w=dm[2].toLowerCase(),i=MN.findIndex(n=>n===w||n.slice(0,3)===w);if(i>-1){day=yr+'-'+p2(i+1)+'-'+p2(dm[1]);out[day]={b:0,l:0,d:0};meal=null;return}}
if(mm){meal=mm[1][0].toLowerCase();return}if(meal&&day&&rx.test(s))out[day][meal]=1};
t.split(/\r?\n/).forEach(l=>{const h=l.match(hd);if(h){yr=+h[3]<100?2000+ +h[3]:+h[3];day=null;meal=null;go(l.slice(h[0].length))}else go(l)});return out}
function openPrev(t){const raw=parseChat(t),ks=Object.keys(raw).sort();if(!ks.length){toast('No meal days found in this file');return}
const al={...raw},z=pk(ks[ks.length-1]);let gap=0;for(const d=pk(ks[0]);d<=z;d.setDate(d.getDate()+1)){const k=dk(d);if(!al[k]){al[k]={b:0,l:0,d:0};gap++}}
const c={b:0,l:0,d:0},conf=[];let amt=0;for(const k in al){MS.forEach(m=>{if(al[k][m]){c[m]++;amt+=S.prices[m]}});if(MS.some(m=>{const e=ent(k,m);return e&&e.s!==al[k][m]}))conf.push(k)}
pend={al,gap,c,amt,conf,n:Object.keys(al).length};md={t:'prev'};showM()}
document.addEventListener('click',async e=>{if(e.target.closest('button:not(.meal)'))fx(600);const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;ana=false;anaMenu=false;render();return}
if(e.target.id==='modal'){closeM();return}if(e.target.id==='lp'){closeLp();return}const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset;
switch(d.a){
case'cyc':cyc(d.k,d.m);break;case'all':all(d.k,+d.s);break;case'clr':withUndo('Day cleared',()=>all(d.k,null));break;
case'undo':if(undoFn){const u=undoFn;undoFn=null;u()}$('#toast').style.display='none';break;
case'day':md={t:'day',k:d.k};showM();break;case'mo':cal.m+=+d.d;if(cal.m>11){cal.m=0;cal.y++}if(cal.m<0){cal.m=11;cal.y--}render();break;
case'addp':payOpen=!payOpen;render();break;
case'tp':pr=!pr;showM();break;
case'savep':{const a=parseFloat($('#pa').value);if(!(a>0)){toast('Enter an amount above 0');break}S.pays.push({i:Date.now(),d:dk(new Date()),a,n:$('#pn').value.trim()});payOpen=false;save();render();toast('Payment added');break}
case'delp':if(await ask('Delete this payment?','Delete')){withUndo('Payment deleted',()=>{S.pays=S.pays.filter(p=>p.i!==+d.i);save();render()})}break;
case'set':pr=false;md={t:'set'};showM();break;case'close':closeM();break;
case'imc':$('#fc').click();break;case'imb':$('#fb').click();break;
case'applyc':{const snap=JSON.stringify(S),ow=$('#ow')&&$('#ow').checked;for(const k in pend.al){if(pend.conf.includes(k)&&!ow)continue;MS.forEach(m=>{const v=pend.al[k][m],x=ent(k,m);if(!x||x.s!==v)setM(k,m,v)})}save();closeM();render();toast('Chat imported',()=>{S=JSON.parse(snap);save();render()});break}
case'csv':if(!Object.keys(S.days).length){toast('No meals to export');break}md={t:'ex'};showM();break;
case'dcsv':{const f=$('#ef').value,e2=$('#et').value;if(!f||!e2||f>e2){toast('Choose a valid date range');break}
const rows=[['Date','Breakfast','Lunch','Dinner','Total']],z=pk(e2);
for(const q=pk(f);q<=z;q.setDate(q.getDate()+1)){const x=S.days[dk(q)]||{};let t=0;const c=MS.map(m=>{const e=x[m];if(e&&e.s){t+=e.p;return'✅'}return'❌'});rows.push([p2(q.getDate())+'/'+p2(q.getMonth()+1)+'/'+q.getFullYear(),...c,'₹'+t])}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='tiffin-export-'+dk(new Date())+'.csv';a.click();closeM();break}
case'adde':{const a=parseFloat($('#ea').value);if(!(a>0)){toast('Enter an amount above 0');break}const n=new Date();S.exp.push({i:Date.now(),d:dk(n),t:p2(n.getHours())+':'+p2(n.getMinutes()),a,n:$('#en').value.trim()});save();render();toast('Saved');break}
case'ana':ana=true;anaV='ov';anaMenu=false;anim=true;render();break;case'aback':ana=false;anaMenu=false;render();break;
case'amenu':anaMenu=!anaMenu;render();break;case'av':anaV=d.v;anaMenu=false;anim=true;render();break;
case'wm':{const m=pk(wkS);m.setDate(m.getDate()+3);const t=+d.d,dm=new Date(m.getFullYear(),m.getMonth()+t+1,0).getDate();wkS=dk(mon(new Date(m.getFullYear(),m.getMonth()+t,Math.min(m.getDate(),dm))));anim=true;render();break}
case'ww':{const m=pk(wkS);m.setDate(m.getDate()+7*(+d.d));wkS=dk(m);anim=true;render();break}
case'my':moY+=+d.d;anim=true;render();break;
case'ovs':{const f=$('#of').value,t=$('#ot').value;if(f&&t&&f>t){toast('Choose a valid date range');break}ovF=f;ovT=t;closeLp();anim=true;render();break}
case'ovr':ovF='';ovT='';closeLp();anim=true;render();break;
case'xed':lp.edit=true;showLp();break;case'xcan':lp.edit=false;showLp();break;
case'xsave':{const x=S.exp.find(v=>v.i===lp.i),dv=$('#xd').value,tv=$('#xt2').value;if(!dv||!tv){toast('Choose date and time');break}x.d=dv;x.t=tv;save();closeLp();render();break}
case'xdel':if(await ask('Delete this expense?','Delete')){withUndo('Expense deleted',()=>{S.exp=S.exp.filter(v=>v.i!==lp.i);save();closeLp();render()})}break;
case'cse':{if(!S.exp.length){toast('No expenses to export');break}const qt=v=>'"'+String(v).replace(/"/g,'""')+'"';
const rows=[['Date','Time','Amount','Note'],...[...S.exp].sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t)||a.i-b.i).map(x=>[fd(x.d),ft(x.t),'₹'+x.a,qt(x.n||'')])];
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='tiffin-expense-'+dk(new Date())+'.csv';a.click();break}
case'exp':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='tiffin-backup-'+dk(new Date())+'.json';a.click();break}
case'reset':if(await ask('Delete ALL meals, payments and settings? This cannot be undone.','Delete everything')){S=def();save();closeM();render();toast('All data reset')}break}});
document.addEventListener('change',e=>{const t=e.target;
if(t.id==='pf'||t.id==='pt'){if(t.id==='pf')pF=t.value;else pT=t.value;render();return}
if(t.id==='cf'||t.id==='ct'){if(t.id==='cf')crF=t.value;else crT=t.value;render();return}
if(t.id==='fx'){S.fx=t.checked;save();return}
if(t.id==='xt'){S.expTab=t.checked;save();render()}
if(t.dataset.p){S.prices[t.dataset.p]=Math.max(0,parseFloat(t.value)||0);save();return}
if(t.id==='sn'){S.name=t.value.trim()||'Manish';save()}
if(t.id==='dm'){S.dark=t.checked;save();render()}
if(t.id==='fc'&&t.files[0]){const r=new FileReader();r.onload=()=>openPrev(String(r.result));r.readAsText(t.files[0]);t.value=''}
if(t.id==='fb'&&t.files[0]){const r=new FileReader();r.onload=async()=>{try{const j=JSON.parse(r.result);if(!j.days||!j.prices)throw 0;if(await ask('Replace all current data with this backup?','Restore')){S={...def(),...j};save();closeM();render();toast('Backup restored')}}catch(x){toast('This is not a valid backup file')}};r.readAsText(t.files[0]);t.value=''}});
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.xrow,.lpt');if(!r)return;sx=e.clientX;sy=e.clientY;clearTimeout(lt);lt=setTimeout(()=>{lp=r.classList.contains('lpt')?{ov:1}:{i:+r.dataset.i,edit:false};showLp();try{navigator.vibrate&&navigator.vibrate(25)}catch(x){}},500)});
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>clearTimeout(lt)));
document.addEventListener('pointermove',e=>{if(lt&&Math.hypot(e.clientX-sx,e.clientY-sy)>10)clearTimeout(lt)});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.xrow,.lpt'))e.preventDefault()});
render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
</script></body></html>
